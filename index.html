<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./guias_metodologicas/presentacion_acro_2027.html">
  <title>Acrojump 2027: ¿Cuántos momentos recordás de tu año?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Abolition';
      src: url('./marca/tipografias/Abolition-Regular.ttf') format('truetype');
      font-weight: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #e6f4f1;
      color: #101d1b;
      font-family: 'Archivo', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      width: 100%;
      border: 1px solid #7ba89f;
      background-color: #d5eae5;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    h1 {
      font-family: 'Abolition', 'Archivo', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      line-height: 1.06;
      text-transform: uppercase;
      color: #101d1b;
    }
    p {
      font-size: 16px;
      line-height: 1.56;
      color: #39504c;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    a {
      min-height: 44px;
      padding: 12px 18px;
      border-radius: 3px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .btn-primary {
      background-color: #b83616;
      color: #fdfaf5;
      border: 1px solid #b83616;
    }
    .btn-secondary {
      background-color: #165e53;
      color: #fdfaf5;
      border: 1px solid #165e53;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>¿Cuántos momentos recordás de tu año?</h1>
    <p>Redirigiendo al pliego conceptual de Acrojump 2027 (@acro_jump). Si no avanza automáticamente, elegí a qué vista entrar:</p>
    <div class="actions">
      <a class="btn-primary" href="./guias_metodologicas/presentacion_acro_2027.html">Abrir Pliego Principal 2027</a>
      <a class="btn-secondary" href="./guias_metodologicas/prototipos_web_acro_2027.html">Abrir Mesa de Prototipos Web (V1 a V6)</a>
    </div>
  </main>
</body>
</html>
